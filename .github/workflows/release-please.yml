name: release-please

on:
  push:
    branches: [main]
  # Recovery path: re-publish an existing release tag whose publish failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.1.1)
        required: true
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Require release App secrets
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$RELEASE_APP_ID" ] || [ -z "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo "::error::Missing RELEASE_APP_ID and/or RELEASE_APP_PRIVATE_KEY repository secrets. Create a GitHub App with only Contents and Pull requests read/write permissions, install it on this repository, and save its App ID and private key as RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY repository secrets."
            exit 1
          fi

      # v2.2.2
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: release-app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token: ${{ steps.release-app-token.outputs.token }}

  # Build and verify in a job with no npm publishing permission: `npm ci` runs
  # dependency install scripts, which must never see the npm OIDC token.
  build:
    needs: release-please
    if: >-
      ${{ !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the release tag
    outputs:
      spec: ${{ steps.pack.outputs.spec }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Validate recovery tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/validate-release-tag.sh

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Verify the tag matches the run and package version
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          set -eu
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG is not the commit this run's provenance will record ($GITHUB_SHA)" >&2
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          tag_version="${TAG#k8s-axi-}"
          tag_version="${tag_version#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "Tag $TAG does not match package version $version" >&2
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Publishing the packed tarball skips prepublishOnly, so run its gate here.
      - run: npm run check

      - name: Pack
        id: pack
        run: |
          set -eu
          npm pkg set gitHead="$(git rev-parse HEAD)"
          tarball="$(npm pack --ignore-scripts --silent)"
          tar -xOzf "$tarball" package/package.json |
            node -e 'let text=""; process.stdin.on("data", c => text += c); process.stdin.on("end", () => { if (JSON.parse(text).gitHead !== process.argv[1]) process.exit(1); });' "$(git rev-parse HEAD)"
          spec="$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  # Publishing runs in its own job with no checkout, no install and no package
  # scripts, so the npm OIDC token is only ever seen by the npm CLI itself.
  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing needs npm >= 11.5.1 and `npm stage` needs
      # npm >= 11.15.0.
      - name: Require npm >= 11.15.0
        run: |
          set -eu
          version="$(npm --version)"
          if ! node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && minor >= 15) ? 0 : 1);
          ' "$version"; then
            echo "::error::npm $version is too old; npm stage publish needs npm >= 11.15.0."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package

      - name: Publish unless this version is already on npm
        env:
          SPEC: ${{ needs.build.outputs.spec }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -eu
          if [ -n "$(npm view "$SPEC" version 2>/dev/null)" ]; then
            echo "$SPEC is already published; nothing to do."
            exit 0
          fi
          if ! npm stage publish "./$TARBALL" --access public --provenance --ignore-scripts; then
            echo "::error::Staging $SPEC failed. If an earlier run already staged it, approve it with 'npm stage approve <id>' or discard it on npmjs.com instead of re-running."
            exit 1
          fi
          version="${SPEC##*@}"
          stage_list="$(npm stage list "${SPEC%@*}" --json 2>/dev/null || true)"
          stage_id="$(node -e 'try { const stages = JSON.parse(process.argv[1]); const stage = stages.find(entry => entry.version === process.argv[2]); process.stdout.write(String(stage?.id ?? stage?.stageId ?? "unavailable")); } catch { process.stdout.write("unavailable"); }' "$stage_list" "$version")"
          {
            echo "## Pending npm stage approval"
            echo "- Stage ID: $stage_id"
            echo "- Package: ${SPEC%@*}"
            echo "- Version: $version"
            echo "- Waiting for approval: run axi-approve"
          } >> "$GITHUB_STEP_SUMMARY"
