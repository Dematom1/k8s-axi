apiVersion: v1
kind: Namespace
metadata:
  name: fixtures
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fixtures
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: app
          image: busybox:1.36.1
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken
  namespace: fixtures
spec:
  replicas: 1
  progressDeadlineSeconds: 5
  selector:
    matchLabels:
      app: broken
  template:
    metadata:
      labels:
        app: broken
    spec:
      containers:
        - name: app
          image: invalid.invalid/broken:never
