name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  live-kind:
    name: live-kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:live

  real-kubectl:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        kubectl: [v1.32.0, v1.36.2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sh scripts/real-kubectl.sh
        env:
          KUBECTL_VERSION: ${{ matrix.kubectl }}
          K8S_AXI_REQUIRE_REAL_KUBECTL: "1"
      - name: Smoke the installed archive
        run: |
          set -eu
          tarball="$(npm pack --ignore-scripts --silent)"
          prefix="$(mktemp -d)"
          npm install --prefix "$prefix" --ignore-scripts --no-audit --no-fund "./$tarball"
          cli="$prefix/node_modules/k8s-axi/dist/bin/k8s-axi.js"
          node "$cli" --version
          node "$cli" --help
          set +e
          HOME="$prefix" KUBECONFIG="$prefix/absent" node "$cli" triage > "$prefix/home.toon"
          code=$?
          set -e
          test "$code" -eq 1
