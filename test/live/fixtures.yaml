apiVersion: v1
kind: Namespace
metadata:
  name: fixtures
---
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: fixtures
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: '{"apiVersion":"v1","kind":"Secret","data":{"username":"Q0FOQVJZX1VTRVJOQU1FXzhLU0E=","password":"Q0FOQVJZX0RCX1BBU1NXT1JEXzhLU0E="}}'
data:
  username: Q0FOQVJZX1VTRVJOQU1FXzhLU0E=
  password: Q0FOQVJZX0RCX1BBU1NXT1JEXzhLU0E=
---
apiVersion: v1
kind: Secret
metadata:
  name: api-token
  namespace: fixtures
stringData:
  token: CANARY_API_TOKEN_8KSA
---
apiVersion: v1
kind: Secret
metadata:
  name: app-dsn
  namespace: fixtures
data:
  dsn: Q0FOQVJZX05FVVRSQUxfRFNOXzhLU0E=
---
apiVersion: v1
kind: Secret
metadata:
  name: app-conn
  namespace: fixtures
stringData:
  conn: CANARY_NEUTRAL_CONN_8KSA
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: fixtures
data:
  setting: safe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fixtures
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'password=CANARY_LOG_8KSA'; sleep 3600"]
          env:
            - name: API_KEY
              value: CANARY_ENV_8KSA
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-creds, key: password }
          envFrom:
            - secretRef: { name: app-dsn }
          volumeMounts:
            - { name: app-conn, mountPath: /etc/app-conn, readOnly: true }
            - { name: leak-scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - name: app-conn
          secret: { secretName: app-conn }
        - name: leak-scripts
          configMap: { name: leak-scripts, defaultMode: 493 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: leak-scripts
  namespace: fixtures
data:
  leak-env: |
    #!/bin/sh
    printf '%s\n' "$DB_PASSWORD"
  leak-b64: |
    #!/bin/sh
    printf '%s' "$DB_PASSWORD" | base64
  leak-neutral: |
    #!/bin/sh
    printf '%s\n' "$dsn"
  leak-file: |
    #!/bin/sh
    cat /etc/app-conn/conn
  leak-token: |
    #!/bin/sh
    cat /var/run/secrets/kubernetes.io/serviceaccount/token
  exit7: |
    #!/bin/sh
    exit 7
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator
  namespace: fixtures
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exec-operator
  namespace: fixtures
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exec-operator
  namespace: fixtures
subjects:
  - { kind: ServiceAccount, name: operator, namespace: fixtures }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: exec-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken
  namespace: fixtures
spec:
  replicas: 1
  progressDeadlineSeconds: 10
  selector:
    matchLabels: { app: broken }
  template:
    metadata:
      labels: { app: broken }
    spec:
      containers:
        - name: broken
          image: registry.invalid/nope:0.0.0
---
apiVersion: v1
kind: Pod
metadata:
  name: chatty
  namespace: fixtures
spec:
  restartPolicy: Never
  containers:
    - name: chatty
      image: busybox:1.36
      command:
        [
          "sh",
          "-c",
          "i=0; while [ $i -lt 3000 ]; do echo line-$i; i=$((i+1)); done; sleep 3600",
        ]
---
apiVersion: v1
kind: Service
metadata:
  name: orphan-svc
  namespace: fixtures
spec:
  selector: { app: does-not-exist }
  ports: [{ port: 80 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: crashy
  namespace: fixtures
spec:
  restartPolicy: Always
  containers:
    - name: crash
      image: busybox:1.36
      command: ["sh", "-c", "exit 3"]
---
apiVersion: v1
kind: Pod
metadata:
  name: crashy2
  namespace: fixtures
spec:
  restartPolicy: Always
  containers:
    - name: crash
      image: busybox:1.36
      command: ["sh", "-c", "exit 7"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: failjob
  namespace: fixtures
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: fail
          image: busybox:1.36
          command: ["sh", "-c", "exit 1"]
---
apiVersion: v1
kind: Namespace
metadata:
  name: emptyns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: fixtures
spec:
  replicas: 1
  selector:
    matchLabels: { app: echo }
  template:
    metadata:
      labels: { app: echo }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "mkdir -p /www; printf 'k8s-axi-echo\\n' > /www/index.html; exec httpd -f -p 8080 -h /www",
            ]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: fixtures
spec:
  selector: { app: echo }
  ports: [{ port: 80, targetPort: http }]
